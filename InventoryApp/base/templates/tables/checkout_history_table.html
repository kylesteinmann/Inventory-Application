<div class="container-fluid px-4">
  <div class="table-responsive">
    <table id="checkoutsTable" class="table table-striped table-bordered table-hover align-middle">
      <thead class="table-light">
        <tr>
          <td class="text-nowrap text-center">Item</td>
          <td class="text-nowrap text-center">Date Out</td>
          <td class="text-nowrap text-center">Date In</td>

          <td class="text-nowrap text-center">Checked Out By</td>

        </tr>
      </thead>
      <tbody>
        {% for item in checkout_history %}
        <tr>
          <td class="text-nowrap text-center">{{item.item}}</td>
          <td class="text-nowrap text-center">{{item.checkout_date|date:"d M Y"}}</td>
          <td class="text-nowrap text-center">{{item.return_date|date:"d M Y"}}</td>
          <td class="text-nowrap text-center">{{item.user.first_name}} {{item.user.last_name}}</td>

        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
